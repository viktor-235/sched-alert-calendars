<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Subscribe link lab</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141417">
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .variants { display: grid; gap: 12px; margin-top: 24px; padding: 0; list-style: none; }
    .variants .card { gap: 8px; }
    .variants code { color: var(--muted); font-size: 0.75rem; overflow-wrap: anywhere; }
    .result { margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <h1 class="page-title">Subscribe link lab</h1>
      <p class="lead">Временная страница для проверки ссылок подписки на Android. Перед каждым вариантом удалите «StopGame — Стримы» из Google Calendar (calendar.google.com → Другие календари), после — проверьте, появился ли он там и в приложении.</p>
      <ol class="variants" id="variants"></ol>
    </div>
  </main>
  <script>
    const ics = 'https://viktor-235.github.io/sched-alert-calendars/stopgame/streams.ics';
    const webcal = ics.replace(/^https:/, 'webcal:');
    const enc = encodeURIComponent;
    const variants = [
      ['Текущая: calendar.google.com/calendar/r, cid=webcal', 'https://calendar.google.com/calendar/r?cid=' + enc(webcal)],
      ['calendar.google.com/calendar/r, cid=https', 'https://calendar.google.com/calendar/r?cid=' + enc(ics)],
      ['calendar.google.com/calendar/render, cid=webcal', 'https://calendar.google.com/calendar/render?cid=' + enc(webcal)],
      ['www.google.com/calendar/render, cid=webcal', 'https://www.google.com/calendar/render?cid=' + enc(webcal)],
      ['Текущая, но принудительно в Chrome (intent://)', 'intent://calendar.google.com/calendar/r?cid=' + enc(webcal) + '#Intent;scheme=https;package=com.android.chrome;end'],
      ['Страница «Добавить по URL» (вставить ссылку вручную)', 'https://calendar.google.com/calendar/r/settings/addbyurl'],
      ['webcal:// напрямую', webcal],
      ['https:// .ics напрямую', ics],
    ];
    const list = document.getElementById('variants');
    variants.forEach(([title, href], i) => {
      const li = document.createElement('li');
      li.className = 'card';
      li.innerHTML = '<h2></h2><code></code><div class="actions"><a class="button button-primary" target="_blank" rel="noopener">Открыть</a></div>';
      li.querySelector('h2').textContent = (i + 1) + '. ' + title;
      li.querySelector('code').textContent = href;
      li.querySelector('a').href = href;
      list.append(li);
    });
  </script>
</body>
</html>
